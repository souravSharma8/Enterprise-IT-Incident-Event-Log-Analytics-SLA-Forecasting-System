version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: incident_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: incident_intelligence
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: incident_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=incident_intelligence
      - TESTING=False
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: incident_dashboard
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
